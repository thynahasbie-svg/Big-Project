
{% extends "base.html" %}

{% block title %}Clock & Timer App{% endblock %}

{% block content %}

<div class="clock-container">

    <h1>Clock & Timer App</h1>

    <!-- JAM DIGITAL -->
    <section class="clock-section">
        <h2>Jam Digital</h2>

        <div id="digital-clock" class="digital-clock">
            00:00:00
        </div>

        <p id="clock-date"></p>
    </section>

    <hr>

    <!-- TIMER -->
    <section class="timer-section">
        <h2>Timer</h2>

        <div class="timer-input">
            <div>
                <label>Jam</label>
                <input type="number" id="hours" min="0" max="99" value="0">
            </div>

            <div>
                <label>Menit</label>
                <input type="number" id="minutes" min="0" max="59" value="1">
            </div>

            <div>
                <label>Detik</label>
                <input type="number" id="seconds" min="0" max="59" value="0">
            </div>
        </div>

        <div id="timer-display" class="timer-display">
            00:01:00
        </div>

        <p id="timer-status">Timer siap digunakan.</p>

        <div class="timer-buttons">
            <button type="button" id="start-btn">Mulai</button>
            <button type="button" id="pause-btn">Pause</button>
            <button type="button" id="edit-btn">Edit Waktu</button>
            <button type="button" id="delete-btn">Hapus</button>
        </div>

    </section>

</div>

<!-- JAVASCRIPT -->
<script>
    // JAM DIGITAL
    function updateClock() {
        const now = new Date();

        const time = now.toLocaleTimeString("id-ID", {
            hour12: false
        });

        const date = now.toLocaleDateString("id-ID", {
            weekday: "long",
            year: "numeric",
            month: "long",
            day: "numeric"
        });

        document.getElementById("digital-clock").textContent = time;
        document.getElementById("clock-date").textContent = date;
    }

    updateClock();
    setInterval(updateClock, 1000);


    // TIMER
    let remainingTime = 60;
    let timerInterval = null;
    let isRunning = false;

    const display = document.getElementById("timer-display");
    const status = document.getElementById("timer-status");

    const hoursInput = document.getElementById("hours");
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");


    // Mengubah detik menjadi format HH:MM:SS
    function formatTime(totalSeconds) {
        const h = Math.floor(totalSeconds / 3600);
        const m = Math.floor((totalSeconds % 3600) / 60);
        const s = totalSeconds % 60;

        return (
            String(h).padStart(2, "0") + ":" +
            String(m).padStart(2, "0") + ":" +
            String(s).padStart(2, "0")
        );
    }


    // Memperbarui tampilan timer
    function updateDisplay() {
        display.textContent = formatTime(remainingTime);
    }


    // Mengambil waktu dari input
    function getInputTime() {
        const h = Number(hoursInput.value);
        const m = Number(minutesInput.value);
        const s = Number(secondsInput.value);

        if (
            !Number.isInteger(h) || h < 0 || h > 99 ||
            !Number.isInteger(m) || m < 0 || m > 59 ||
            !Number.isInteger(s) || s < 0 || s > 59
        ) {
            alert("Masukkan waktu yang valid!");
            return null;
        }

        return h * 3600 + m * 60 + s;
    }


    // MEMULAI TIMER
    document.getElementById("start-btn").addEventListener("click", function () {
        if (isRunning) return;

        if (remainingTime <= 0) {
            remainingTime = getInputTime();

            if (remainingTime === null) return;

            if (remainingTime <= 0) {
                alert("Masukkan waktu lebih dari 0!");
                return;
            }
        }

        isRunning = true;
        status.textContent = "Timer sedang berjalan.";

        timerInterval = setInterval(function () {
            if (remainingTime > 0) {
                remainingTime--;
                updateDisplay();
            }

            if (remainingTime <= 0) {
                clearInterval(timerInterval);
                timerInterval = null;
                isRunning = false;
                status.textContent = "Waktu selesai!";
                alert("Timer selesai!");
            }
        }, 1000);
    });


    // PAUSE TIMER
    document.getElementById("pause-btn").addEventListener("click", function () {
        if (timerInterval !== null) {
            clearInterval(timerInterval);
            timerInterval = null;
            isRunning = false;
            status.textContent = "Timer dijeda.";
        }
    });


    // EDIT WAKTU
    document.getElementById("edit-btn").addEventListener("click", function () {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;

        const newTime = getInputTime();

        if (newTime === null) return;

        remainingTime = newTime;
        updateDisplay();

        status.textContent = "Waktu berhasil diperbarui.";
    });


    // HAPUS / RESET TIMER
    document.getElementById("delete-btn").addEventListener("click", function () {
        clearInterval(timerInterval);
        timerInterval = null;
        isRunning = false;

        remainingTime = 0;

        hoursInput.value = 0;
        minutesInput.value = 0;
        secondsInput.value = 0;

        updateDisplay();

        status.textContent = "Timer telah dihapus.";
    });

    updateDisplay();
</script>

{% endblock %}
